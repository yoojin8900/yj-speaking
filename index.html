<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f2f4f9"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="말하기 연습장"><link rel="icon" href="icon-192.png">
<title>YJ 말하기 연습장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Jua&display=swap">
<style>
/* 레이아웃: 학생은 한 줄 카드 흐름(폰 우선), 선생님은 넓은 표 */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --surface2:#f7f8fc; --ink:#1b2232; --muted:#667085; --line:#e2e6ef;
  --accent:#2f6be0; --accent-soft:#e6edfc; --rec:#ef5a43; --rec-soft:#fde8e4;
  --good:#1c9a68; --good-soft:#e1f4eb; --warn:#d9820f; --warn-soft:#fcf0db; --bad:#d63b3b; --bad-soft:#fce5e3;
  --star:#f4b000; --star-off:#dfe3ea; --violet:#7d55e8; --violet-soft:#efe9fd; --pink:#d9437a;
  --leaf:#f07b3f; --leaf-soft:#fdeee4;
  --blob1:#dfe9ff; --blob2:#ffe6d4; --pal1:#e3f4ea; --pal2:#eceafd; --pal3:#fdebdc;
  --shadow:0 1px 2px rgba(27,34,50,.06),0 6px 20px rgba(27,34,50,.06);
  --f-display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141c; --surface:#1a1f2c; --surface2:#20263540; --ink:#e8ecf4; --muted:#9aa3b5; --line:#2b3245;
  --accent:#6f9bff; --accent-soft:#223154; --rec:#ff735e; --rec-soft:#3d2422;
  --good:#45c28f; --good-soft:#1b3a2f; --warn:#f0a646; --warn-soft:#3a2e1a; --bad:#ff7070; --bad-soft:#3c2023;
  --star:#ffc83d; --star-off:#394155; --violet:#a98bff; --violet-soft:#2d2650; --pink:#ff79a8;
  --leaf:#ff9a63; --leaf-soft:#3b2a21; --blob1:#1e2b4d; --blob2:#3a2a22; --pal1:#1f3a2e; --pal2:#2c2a4f; --pal3:#3d2c22; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141c; --surface:#1a1f2c; --surface2:#20263540; --ink:#e8ecf4; --muted:#9aa3b5; --line:#2b3245;
  --accent:#6f9bff; --accent-soft:#223154; --rec:#ff735e; --rec-soft:#3d2422;
  --good:#45c28f; --good-soft:#1b3a2f; --warn:#f0a646; --warn-soft:#3a2e1a; --bad:#ff7070; --bad-soft:#3c2023;
  --star:#ffc83d; --star-off:#394155; --violet:#a98bff; --violet-soft:#2d2650; --pink:#ff79a8;
  --leaf:#ff9a63; --leaf-soft:#3b2a21; --blob1:#1e2b4d; --blob2:#3a2a22; --pal1:#1f3a2e; --pal2:#2c2a4f; --pal3:#3d2c22; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1180px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.card{background:var(--surface);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:18px;font-weight:700}
.step{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--surface2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;min-height:42px}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.violet{background:var(--violet-soft);color:var(--violet)}
.chip.leaf{background:var(--leaf-soft);color:var(--leaf)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-size:18px;color:var(--leaf);letter-spacing:.01em}
.back{border:0;background:transparent;font-weight:600;color:var(--muted);padding:6px 4px;display:inline-flex;gap:4px;align-items:center}
.stars{display:inline-flex;gap:1px;color:var(--star-off);letter-spacing:0;line-height:1}
.stars i{font-style:normal}
.stars i.on{color:var(--star)}
/* 홈 */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 0 6px}
.hero .cats{display:flex;gap:6px;align-items:flex-end}
.hero .cats img{width:72px;height:72px;object-fit:contain}
.hero .cats img:nth-child(2){width:88px;height:88px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1.1}
.grade-sec h2{font-size:14px;font-weight:700;color:var(--muted);margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tile{border:0;background:var(--surface);border-radius:18px;padding:14px 8px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px}
.tile .av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;overflow:hidden}
.tile .av img{width:46px;height:46px;object-fit:contain}
.tile b{font-size:16px}
.g1 .av{background:#fde7e2}.g2 .av{background:#fdeedd}.g3 .av{background:#e4f4e9}.g4 .av{background:#e2f0fb}.g5 .av{background:#e8e7fb}.g6 .av{background:#f7e4f0}
:root[data-theme="dark"] .tile .av{background:var(--surface2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile .av{background:#262d3f}}
.gtag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.gt1{background:#fde7e2;color:#c2412d}.gt2{background:#fdeedd;color:#b5620d}.gt3{background:#e4f4e9;color:#1f8550}.gt4{background:#e2f0fb;color:#2266b0}.gt5{background:#e8e7fb;color:#5a47c9}.gt6{background:#f7e4f0;color:#b23b7c}
/* 첫 화면 */
.landing .cover{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:34px 16px 30px;border-radius:28px;background:radial-gradient(60% 70% at 0% 20%,var(--blob1),transparent 70%),radial-gradient(55% 70% at 100% 90%,var(--blob2),transparent 70%),var(--surface);box-shadow:var(--shadow);overflow:hidden}
.pals{display:flex;gap:14px;margin-bottom:6px}
.pal{width:84px;height:84px;border-radius:50%;display:grid;place-items:center}
.pal img{width:66px;height:66px;object-fit:contain}
.pal.p1{background:var(--pal1)}.pal.p2{background:var(--pal2);transform:translateY(-6px)}.pal.p3{background:var(--pal3)}
@media (prefers-reduced-motion:no-preference){.pal{animation:bob 3.2s ease-in-out infinite}.pal.p2{animation-delay:.4s}.pal.p3{animation-delay:.8s}}
@keyframes bob{50%{translate:0 -5px}}
.cover h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,11vw,58px);line-height:1.05;letter-spacing:-.01em}
.cover .sub{margin:0;color:var(--muted);font-size:15px}
.cta{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px;margin-top:14px}
.btn.big{min-height:54px;font-size:17px;border-radius:16px;justify-content:center}
.how h2{font-size:16px;margin:4px 0 10px}
.howg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hw{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;min-width:0}
.hw img{width:44px;height:44px;object-fit:contain;margin-bottom:4px}
.hw .no{font-size:12px;font-weight:700;color:var(--accent)}
.hw b{font-size:15px}
.hw p{margin:0;font-size:13px;color:var(--muted)}
.gpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gbtn{border:0;border-radius:18px;min-height:64px;font-size:19px;font-weight:700;box-shadow:var(--shadow)}
.gbtn.on{outline:3px solid currentColor;outline-offset:2px}
/* 플레이어 */
.player{display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,#1f2a4a,#2d3f73);color:#fff;border-radius:16px;padding:16px}
.player .ptitle{font-weight:700;text-align:center;font-size:15px;opacity:.95}
.pbar{height:6px;border-radius:6px;background:rgba(255,255,255,.22);position:relative;cursor:pointer}
.pbar>span{position:absolute;inset:0 auto 0 0;background:#fff;border-radius:6px}
.pctrl{display:flex;align-items:center;gap:10px}
.pplay{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#1f2a4a;font-size:18px;display:grid;place-items:center}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* 부분 카드 */
.parts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.part{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.part.done{background:var(--good-soft);border-color:transparent}
.part .ph{display:flex;align-items:center;gap:6px}
.part .ph b{font-size:15px}
.part .check{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:13px}
.part p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.part .meta{font-size:12px;color:var(--muted)}
@media (max-width:420px){.parts{grid-template-columns:1fr}}
/* 원고 */
.script{font-size:18px;line-height:2.05;word-break:keep-all}
.script .w{border-radius:6px;padding:1px 1px}
.script b{color:var(--rec);font-weight:700}
.script .pm{color:var(--accent);font-weight:700;margin:0 3px;font-size:15px}
.script .ar{color:var(--violet);font-weight:700;font-size:15px}
.script .nm{display:inline-block;min-width:64px;border-bottom:2px dashed var(--muted);text-align:center;color:var(--muted);font-size:14px}
.script.hide .w{color:transparent;background:var(--line);border-radius:6px}
.script.hide .w.first{color:var(--ink);background:transparent}
.script.hide b{color:transparent}
.script.hide .w.first b{color:var(--rec)}
.res .w.miss{background:var(--bad-soft);color:var(--bad);cursor:pointer;text-decoration:underline dotted}
.res .w.close{background:var(--warn-soft);color:var(--warn);cursor:pointer}
.res .w.miss b,.res .w.close b{color:inherit}
.res .ok-p{font-size:11px;font-weight:700;color:var(--good);background:var(--good-soft);border-radius:6px;padding:1px 5px;margin:0 3px;vertical-align:2px}
.res .need-p{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 5px;margin:0 3px;vertical-align:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
/* 녹음 */
.recbox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 4px}
.recbtn{width:118px;height:118px;border-radius:50%;border:0;background:var(--rec);color:#fff;font-weight:700;font-size:17px;line-height:1.25;box-shadow:0 10px 30px rgba(239,90,67,.35);position:relative}
.recbtn.on{animation:pulse 1.4s ease-in-out infinite}
.recbtn.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--rec);opacity:.35}
@keyframes pulse{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.recbtn.on{animation:none}.spin{animation:none!important}}
.timer{display:flex;justify-content:space-between;width:100%;font-size:13px;color:var(--muted)}
.tbar{width:100%;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.tbar span{display:block;height:100%;background:var(--accent);width:0}
.tbar span.over{background:var(--warn)}
.level{width:100%;height:36px}
.notice{border-radius:14px;padding:12px 14px;font-size:14px;background:var(--warn-soft);color:var(--ink)}
.notice b{color:var(--warn)}
/* 분석 중 */
.listening{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 0}
.listening img{width:120px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* 결과 */
.bigstars{font-size:40px;text-align:center}
.fb{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.fb .ic{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:16px}
.fb.good .ic{background:var(--good-soft)}
.fb.tip .ic{background:var(--warn-soft)}
.fb .lb{font-size:12px;font-weight:700;color:var(--muted)}
.fb p{margin:2px 0 0;font-size:15px}
.crit{display:flex;flex-direction:column}
.crit .ci{display:flex;align-items:center;gap:8px;padding:11px 2px;border-bottom:1px solid var(--line)}
.crit .ci:last-child{border-bottom:0}
.crit .ci .nm{font-weight:600;font-size:15px;white-space:nowrap}
@media (max-width:420px){.crit .ci{flex-wrap:wrap;row-gap:4px}.crit .ci .stars{margin-left:auto}}
.crit .ci .stars{margin-left:auto;font-size:17px}
.crit .ci .sc{width:42px;text-align:right;font-size:13px;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--f-body)}
.chart-wrap{overflow-x:auto}
/* 선생님 */
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700}
@media (max-width:700px){.tiles4{grid-template-columns:1fr 1fr}}
.tbl-wrap{overflow-x:auto;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:14px}
th,td{padding:11px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface2)}
td.l,th.l{text-align:left}
td .lo{color:var(--bad);font-weight:700}
td .hi{color:var(--good);font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,24,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));z-index:30}
.modal{background:var(--bg);border-radius:20px;max-width:980px;width:100%;padding:20px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px}
.pin{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0}
.pin input{width:160px;text-align:center;font-size:24px;letter-spacing:.3em}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
.demo-flag{background:var(--violet-soft);color:var(--violet);font-weight:700;font-size:12px;padding:4px 10px;border-radius:8px}
</style>

function align(S,R){

    const v=dp[i][j];if(v>=INF)continue;

    }

    if(b===1){j--;continue}

    res.comp=Math.round(clamp(100*(ok+close+0.5*sub)/N,0,100));
    const said=ok+close+sub;
    res.pron=said?Math.round(clamp(100*(ok+0.6*close+0.25*sub)/said*1.04,0,100)):0;
    wordRes=al.map(a=>a.st);
  }else{res.comp=null;res.pron=null}
  // 2. 속도
  const target=sam.span+(withIntro?INTRO_SEC:0);
  const r=stu.span/target;
  res.speed=Math.round(clamp(r<0.9?100-(0.9-r)*260:r>1.15?100-(r-1.15)*200:100,25,100));
  res.speedRatio=r;res.time=stu.span;res.target=target;
  // 3. 쉼
  const stallT=Math.max(2.2,sam.maxPause+0.6);
  const ps=stu.pauses.filter(q=>q.d>=0.35&&q.d<stallT),stalls=stu.pauses.filter(q=>q.d>=stallT);
  const expP=Math.max(1,sam.pauses+(withIntro?2:0));
  const pr=ps.length/expP;
  let pz=pr<0.85?100-(0.85-pr)*120:pr>1.6?100-(pr-1.6)*60:100;
  pz-=stalls.length*10;
  res.pause=Math.round(clamp(pz,20,100));res.pauseCount=ps.length;res.pauseExp=expP;res.stalls=stalls.length;
  // 4. 억양
  if(stuContour&&sam.contour){
    const c=corr(stuContour.pts,sam.contour.pts);
    const rangeS=clamp(stuContour.sd/(0.8*sam.contour.sd),0,1)*100;
    const corrS=clamp((c+0.1)/0.7,0,1)*100;
    res.into=Math.round(0.5*corrS+0.5*rangeS);res.flat=stuContour.sd<0.6*sam.contour.sd;
  }else res.into=null;
  // 종합
  const W={pron:.25,comp:.25,into:.15,speed:.15,pause:.2};let s=0,w=0;
  for(const k in W)if(res[k]!=null){s+=res[k]*W[k];w+=W[k]}
  res.total=Math.round(s/w);res.stars=starsOf(res.total);
  // 쉬는 자리 표시(단어 시간 추정)
  let pauseMarks=null;
  if(al&&recTimes&&recTimes.length){
    const tOf=ri=>{if(ri<0)return null;const e=recTimes.find(x=>x.n>ri);return e?Math.max(0,e.t-0.45):null};
    pauseMarks=items.map((it,i)=>{
      if(it.pause<2||i===items.length-1)return 0;
      const a=al[i],b=al[i+1];if(!a||!b||a.ri<0||b.ri<0)return 0;
      const ta=tOf(a.ri),tb=tOf(b.ri);if(ta==null||tb==null)return 0;
      const hit=stu.pauses.some(q=>q.d>=0.3&&q.t>=ta-0.9&&q.t<=tb+0.3);
      return hit?1:-1;
    });
  }
  return{res,wordRes,pauseMarks,heard:al?al.map(a=>a.heard||""):null};
}
function feedback(g,items,sc){
  const r=sc.res,good=[],tips=[];
  const sentences=[];items.forEach((it,i)=>{if(it.first)sentences.push(i)});
  const sentAt=i=>{let s=0;for(const k of sentences)if(k<=i)s=k;return items.slice(s,s+6).map(x=>x.raw).join(" ").replace(/[“”"]/g,"")};
  const vals=CRIT.filter(c=>r[c.k]!=null).map(c=>({k:c.k,v:r[c.k]})).sort((a,b)=>b.v-a.v);
  const praise={comp:"원고를 하나도 빠뜨리지 않고 끝까지 말했어요! 정말 대단해요.",pron:"단어 하나하나를 또박또박 정확하게 말했어요.",into:"목소리가 표본처럼 오르락내리락 살아 있어요.",speed:"표본과 딱 비슷한 빠르기로 말했어요.",pause:"쉬는 자리를 잘 지켜서 듣기 편해요."};
  if(vals.length&&vals[0].v>=70)good.push(praise[vals[0].k]);
  if(vals.length>1&&vals[1].v>=88)good.push(praise[vals[1].k]);
  if(!good.length)good.push("끝까지 녹음한 것만으로도 멋져요! 한 번 할 때마다 더 좋아져요.");
  const low=vals.slice().reverse().filter(x=>x.v<85);
  for(const x of low){
    if(tips.length>=2)break;
    if(x.k==="pause"){
      if(r.stalls>0)tips.push(`중간에 오래 멈춘 곳이 ${r.stalls}번 있었어요. 막힌 문장만 3번 더 말해 봐요.`);
      else if(sc.pauseMarks){const i=sc.pauseMarks.indexOf(-1);if(i>=0)tips.push(`‘${items[i].raw.replace(/[“”"]/g,"")}’ 다음에서 숨을 한 번 쉬어 보세요. 듣는 사람이 이야기를 더 잘 따라올 수 있어요.`);else tips.push("// 표시에서 1초씩 쉬어 보세요.");}
      else tips.push(r.pauseCount<r.pauseExp?"// 표시에서 1초씩 쉬어 보세요. 지금은 쉬지 않고 이어서 말했어요.":"너무 자주 멈췄어요. / 표시가 없는 곳은 이어서 말해요.");
    }else if(x.k==="comp"&&sc.wordRes){const i=sc.wordRes.findIndex((s,k)=>s==="miss"&&!items[k].wild);tips.push(i>=0?`‘${sentAt(i)}…’ 문장에서 빠진 말이 있어요. 원고를 보며 한 번 더 말해 봐요.`:"원고와 다른 말이 있었어요. 빨간 글자를 확인해 봐요.")}
    else if(x.k==="pron"&&sc.wordRes){const ws=[];sc.wordRes.forEach((s,k)=>{if((s==="close"||s==="sub")&&ws.length<2&&!items[k].wild)ws.push(items[k].raw.replace(/[^A-Za-z']/g,""))});tips.push(ws.length?`${ws.map(w=>`‘${w}’`).join(", ")} 단어를 눌러 표본 발음을 듣고 따라 해 봐요.`:"입을 크게 벌리고 단어 끝소리까지 또박또박 말해 봐요.")}
    else if(x.k==="speed"){const d=Math.abs(Math.round(r.time-r.target));tips.push(r.speedRatio<1?`표본보다 ${d}초 빨라요. / 표시에서 조금씩 쉬면 딱 맞아요.`:`표본보다 ${d}초 느려요. 문장 안에서는 이어서 말해 봐요.`)}
    else if(x.k==="into"){tips.push(r.flat?`목소리가 조금 평평해요. ‘${sentAt(0)}…’부터 빨간 글자를 크고 높게 말해 봐요.`:"아래 오르내림 그래프에서 표본과 다른 곳을 찾아 따라 해 봐요.")}
  }
  return{good,tips};
}

const REC={on:false};
function getSR(){return window.SpeechRecognition||window.webkitSpeechRecognition||null}
async function startRec(){
  const msg=app.querySelector("#msg");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){return micFail("이 화면에서는 마이크를 쓸 수 없어요.")}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){return micFail(e&&e.name==="NotAllowedError"?"마이크 사용을 허용해 주세요. 주소창 옆 자물쇠 아이콘에서 바꿀 수 있어요.":"마이크를 켤 수 없어요.")}
  stopAll();
  const c=ctx();if(c.state==="suspended")await c.resume();
  const src=c.createMediaStreamSource(stream),proc=c.createScriptProcessor(4096,1,1),an=c.createAnalyser();an.fftSize=1024;
  const chunks=[];proc.onaudioprocess=e=>{if(REC.on)chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))};
  src.connect(an);src.connect(proc);const mute=c.createGain();mute.gain.value=0;proc.connect(mute);mute.connect(c.destination);
  let mr=null,blobs=[];
  try{const mt=["audio/webm;codecs=opus","audio/mp4","audio/webm"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));mr=new MediaRecorder(stream,mt?{mimeType:mt}:undefined);mr.ondataavailable=e=>{if(e.data.size)blobs.push(e.data)};mr.start()}catch(e){mr=null}
  // 음성 인식
  const SR=getSR();let sr=null;const finals=[];let interim="";const times=[];const t0=performance.now();
  const startSR=()=>{if(!SR)return;try{sr=new SR();sr.lang="en-US";sr.continuous=true;sr.interimResults=true;sr.maxAlternatives=1;
    sr.onresult=e=>{interim="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finals.push(t);else interim+=" "+t}
      const n=(finals.join(" ")+" "+interim).split(/\s+/).filter(Boolean).length;times.push({t:(performance.now()-t0)/1000,n})};
    sr.onerror=e=>{REC.srErr=e.error};sr.onend=()=>{if(REC.on&&REC.srErr!=="not-allowed"&&REC.srErr!=="service-not-allowed")setTimeout(()=>{if(REC.on)startSR()},50)};sr.start()}catch(e){REC.srErr="start"}};
  Object.assign(REC,{on:true,stream,src,proc,an,chunks,mr,blobs,sr:()=>sr,finals,getInterim:()=>interim,times,t0,sampleRate:c.sampleRate,srErr:null,hasSR:!!SR});
  startSR();
  const btn=app.querySelector("#rec");btn.classList.add("on");btn.innerHTML="다 했어요<br>멈추기";
  app.querySelector("#msg").innerHTML="";
  const lv=app.querySelector("#lv"),g2=lv.getContext("2d"),el=app.querySelector("#el"),tb=app.querySelector("#tb");
  const s=student(S.sid),tgt=audioDur(s.grade,S.part)+(S.part===0||S.part==="full"?INTRO_SEC:0);
  const data=new Uint8Array(an.fftSize),hist=[];
  const tick=()=>{if(!REC.on)return;an.getByteTimeDomainData(data);let m=0;for(const v of data)m=Math.max(m,Math.abs(v-128));hist.push(m/128);if(hist.length>120)hist.shift();
    const W=lv.width,H=lv.height;g2.clearRect(0,0,W,H);g2.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--rec");
    hist.forEach((v,i)=>{const h=Math.max(3,v*H*1.6);g2.fillRect(i*5,(H-h)/2,3,Math.min(H,h))});
    const el2=(performance.now()-t0)/1000;el.textContent=fmt(el2);tb.style.width=Math.min(100,el2/tgt*100)+"%";tb.classList.toggle("over",el2>tgt*1.15);
    if(el2>tgt*2.5+20){finishRec();return}REC.raf=requestAnimationFrame(tick)};tick();
}
function micFail(text){
  const box=app.querySelector("#msg");if(!box)return;
  box.innerHTML=`<div class="notice"><b>녹음이 안 돼요.</b> ${text}<div class="row" style="margin-top:8px"><button class="btn sm" id="demo">예시 결과 보기</button></div></div>`;
  box.querySelector("#demo").onclick=()=>demoResult();
}
function stopRec(silent){
  if(!REC.on)return null;REC.on=false;cancelAnimationFrame(REC.raf);
  try{REC.sr()&&REC.sr().stop()}catch(e){}
  try{REC.mr&&REC.mr.state!=="inactive"&&REC.mr.stop()}catch(e){}
  try{REC.proc.disconnect();REC.src.disconnect()}catch(e){}
  setTimeout(()=>REC.stream.getTracks().forEach(t=>t.stop()),300);
  return REC;
}
async function finishRec(){
  const r=stopRec();if(!r)return;
  const s=student(S.sid),g=s.grade,p=S.part;
  app.querySelector(".recbox").innerHTML=`<div class="listening"><img src="${CAT(1)}" alt=""><div class="spin"></div><b>두두가 듣고 있어요</b><span class="small muted">조금만 기다려 주세요</span></div>`;
  await new Promise(res=>setTimeout(res,700)); // 마지막 인식 결과 기다리기
  const len=r.chunks.reduce((a,c)=>a+c.length,0),buf=new Float32Array(len);let o=0;for(const c of r.chunks){buf.set(c,o);o+=c.length}
  if(len<r.sampleRate*1.5){toast("너무 짧아요. 다시 녹음해 주세요.");return go("practice")}
  let sam;try{sam=await analyzeSample(g,p)}catch(e){sam={span:audioDur(g,p),pauses:6,maxPause:1.5,contour:null}}
  const ds=downsample(buf,r.sampleRate),stu=speechInfo(ds.x,ds.sr),stuC=contour(pitchTrack(ds.x,ds.sr));
  const text=(r.finals.join(" ")+" "+r.getInterim()).trim();
  const recWords=text?text.split(/\s+/).map(normWord).filter(Boolean):null;
  const items=parseText(partText(g,p));
  const sc=score({g,p,items,recWords,recTimes:r.times,stu,sam,stuContour:stuC});
  const fb=feedback(g,items,sc);
  const at={id:"a"+Date.now().toString(36),sid:s.id,grade:g,part:p,at:Date.now(),res:sc.res,word:sc.wordRes,pause:sc.pauseMarks,fb,
    contour:{s:sam.contour?sam.contour.pts.map(v=>+v.toFixed(1)):null,k:stuC?stuC.pts.map(v=>+v.toFixed(1)):null},srOk:!!recWords,srErr:r.hasSR?r.srErr:"none"};
  Store.addAttempt(at);
  if(r.blobs.length){setTimeout(async()=>{await AudioDB.put(at.id,new Blob(r.blobs,{type:r.mr.mimeType||"audio/webm"}));const rq=LS.get("yj_recq",[]);rq.push(at.id);LS.set("yj_recq",rq);setTimeout(flush,300)},400)}
  go("result",{attempt:at,demo:false});
}

function critChip(k,r){
  const v=r[k];if(v==null)return '<span class="chip">확인 못 함</span>';
  if(k==="speed")return r.speedRatio<0.9?'<span class="chip warn">빨라요</span>':r.speedRatio>1.15?'<span class="chip warn">느려요</span>':'<span class="chip good">좋아요</span>';
  if(k==="comp"&&v>=95)return '<span class="chip good">다 말했어요</span>';
  if(k==="pause"&&r.stalls)return `<span class="chip bad">${r.stalls}번 멈췄어요</span>`;
  if(k==="into"&&r.flat)return '<span class="chip violet">더 살려요</span>';
  return v>=85?'<span class="chip good">잘했어요</span>':"";
}
function contourSvg(c){
  if(!c||!c.s||!c.k)return '<p class="small muted">목소리 높낮이를 찾지 못했어요. 조용한 곳에서 조금 더 크게 말해 주세요.</p>';
  const W=600,H=150,pad=10,all=c.s.concat(c.k),mx=Math.max(3,...all.map(Math.abs));
  const pt=a=>a.map((v,i)=>`${(pad+i/(a.length-1)*(W-2*pad)).toFixed(1)},${(H/2-v/mx*(H/2-pad)).toFixed(1)}`).join(" ");
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="표본과 내 목소리 높낮이 비교">
    <line x1="${pad}" x2="${W-pad}" y1="${H/2}" y2="${H/2}" stroke="var(--line)" stroke-width="1"/>
    <polyline points="${pt(c.s)}" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linejoin="round" opacity=".55"/>
    <polyline points="${pt(c.k)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
    <div class="legend"><span><i style="background:var(--muted);opacity:.55"></i>표본</span><span><i style="background:var(--accent)"></i>나</span><span>높이가 아닌 오르내림 모양을 비교해요</span></div>`;
}

function lineChart(series,n,opts={}){
  const W=640,H=220,L=34,R=14,T=12,B=28,xs=i=>L+(n<=1?0.5:i/(n-1))*(W-L-R),ys=v=>T+(1-v/100)*(H-T-B);

  [0,25,50,75,100].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L-6}" y="${ys(v)+4}" font-size="11" text-anchor="end">${v}</text>`});
  for(let i=0;i<n;i++)g+=`<text x="${xs(i)}" y="${H-8}" font-size="11" text-anchor="middle">${i+1}회</text>`;
  series.forEach(s=>{const pts=s.v.map((v,i)=>v==null?null:[xs(i),ys(v)]).filter(Boolean);if(!pts.length)return;
    g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${s.color}" stroke-width="${s.bold?3:2}" ${s.bold?"":'stroke-dasharray="5 4"'} stroke-linejoin="round"/>`;
    pts.forEach((p,i)=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="${s.color}"/>`)});
  return `<div class="chart-wrap">${g}</svg></div><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}</div>`;
}

  const rows=R.slice().sort((a,b)=>a.grade-b.grade).map(s=>{
    const at=A.filter(a=>a.sid===s.id),full=at.filter(a=>a.part==="full"),parts=at.length-full.length;
    const ref=full[full.length-1]||at[at.length-1];const r=ref?ref.res:null;
    const cell=v=>v==null?'<span class="muted">-</span>':`<span class="${v<60?"lo":v>=90?"hi":""}">${v}</span>`;
    const over=r&&r.time>r.target*1.15;
    return `<tr><td class="l"><b>${esc(s.name)}</b></td><td><span class="gtag gt${s.grade}">${s.grade}학년</span></td>
      <td class="num">${parts}<span class="muted small"> / 전체 ${full.length}</span></td>
      <td class="num">${r?`<b>${cell(r.total)}</b>`:"-"}</td>${CRIT.map(c=>`<td class="num">${r?cell(r[c.k]):"-"}</td>`).join("")}
      <td class="num">${r?`<span class="${over?"lo":""}">${fmt(r.time)}</span><span class="muted small"> / ${fmt(r.target)}</span>`:"-"}</td>
      <td class="small muted">${ref?(ref.part==="full"?"전체":`${ref.part+1}부분`):""}</td>
      <td><button class="btn sm primary" data-det="${s.id}" ${at.length?"":"disabled"}>자세히</button></td></tr>`}).join("");
  const fulls=A.filter(a=>a.part==="full");
  const avg=fulls.length?Math.round(fulls.reduce((a,b)=>a+b.res.total,0)/fulls.length):null;
  return `<div class="wrap wide stack">
    <div class="topbar"><button class="back" id="bk">‹ 처음으로</button><span class="spacer"></span><span class="brand">YJ ENGLISH</span></div>
    <div><div class="eyebrow">선생님 화면</div><h2 style="font-size:26px">우리 반 말하기 현황</h2><p class="small muted" style="margin:4px 0 0">최근 전체 읽기 점수(없으면 최근 부분 연습)를 보여 줘요. 100점 만점이고 60점 아래는 빨간색이에요.</p></div>
    <div class="tiles4">
      <div class="stat"><div class="k">학생</div><div class="v num">${R.length}명</div></div>
      <div class="stat"><div class="k">오늘 연습</div><div class="v num">${A.filter(a=>new Date(a.at).toDateString()===today).length}번</div></div>
      <div class="stat"><div class="k">전체 읽기 평균</div><div class="v num">${avg==null?"-":avg+"점"}</div></div>
      <div class="stat"><div class="k">아직 시작 안 한 학생</div><div class="v num">${R.filter(s=>!A.some(a=>a.sid===s.id)).length}명</div></div>
    </div>
    <div class="tbl-wrap"><table><thead><tr><th class="l">이름</th><th>학년</th><th>연습(부분/전체)</th><th>종합</th>${CRIT.map(c=>`<th>${c.short}</th>`).join("")}<th>시간 / 표본</th><th>기준</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="card stack"><h3>학생 관리</h3>
      <div class="row"><input id="nn" placeholder="이름 (예: 서아)" aria-label="이름" style="flex:1;min-width:140px"><select id="ng" aria-label="학년">${[1,2,3,4,5,6].map(g=>`<option value="${g}">${g}학년</option>`).join("")}</select><button class="btn primary" id="add">추가</button></div>
      <div class="row" style="gap:6px">${R.map(s=>`<span class="chip" style="font-size:13px">${s.grade}학년 ${esc(s.name)} <button class="btn ghost sm" data-del="${s.id}" aria-label="${esc(s.name)} 삭제" style="min-height:0;padding:0 2px">✕</button></span>`).join("")}</div>
      <div class="row"><span class="small muted">반 코드</span><input id="ncode" style="width:140px" aria-label="반 코드" value="${esc(Cache.code||"")}"><button class="btn sm" id="scode">바꾸기</button><span class="spacer"></span><span class="small muted">선생님 비밀번호</span><input id="np" inputmode="numeric" maxlength="8" style="width:110px" aria-label="새 비밀번호"><button class="btn sm" id="sp">바꾸기</button></div>
      <p class="small muted" style="margin:0">반 코드를 바꾸면 학생들도 새 코드를 넣어야 해요. 학생을 지워도 지난 기록은 서버에 남아 있어요.</p>
    </div>
    <div id="det"></div></div>`;
}
async function loadTeacher(pin){const d=await rpc("sp_teacher",{pin});Cache.roster=d.students;Cache.all=d.attempts;Cache.recs=new Set(d.recs||[]);Cache.code=d.code;LS.set("yj_roster_cache",Cache.roster);return d}
bind.teacher=()=>{
  app.querySelector("#bk").onclick=()=>{Cache.all=null;go("home")};
  if(!S.auth){const i=app.querySelector("#pin");i.focus();const ok=async()=>{try{await loadTeacher(i.value);S.auth=true;S.pin=i.value;render()}catch(e){toast(/bad_pin/.test(e.message)?"비밀번호가 달라요":"연결이 안 돼요");i.value=""}};app.querySelector("#ok").onclick=ok;i.onkeydown=e=>{if(e.key==="Enter")ok()};return}
  const re=async m=>{await loadTeacher(S.pin);render();if(m)toast(m)};
  app.querySelector("#add").onclick=async()=>{const n=app.querySelector("#nn").value.trim();if(!n)return toast("이름을 넣어 주세요");try{await rpc("sp_add_student",{pin:S.pin,name:n,grade:+app.querySelector("#ng").value});re("추가했어요")}catch(e){toast("추가하지 못했어요")}};
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{const id=b.dataset.del;if(b.dataset.sure){try{await rpc("sp_del_student",{pin:S.pin,sid:id});re("삭제했어요")}catch(e){toast("삭제하지 못했어요")}}else{b.dataset.sure="1";b.textContent="삭제?";}});
  app.querySelector("#sp").onclick=async()=>{const v=app.querySelector("#np").value.trim();if(!/^\d{4,8}$/.test(v))return toast("숫자 4자리 이상으로 넣어 주세요");try{await rpc("sp_set",{pin:S.pin,k:"teacher_pin",v});S.pin=v;toast("비밀번호를 바꿨어요")}catch(e){toast("바꾸지 못했어요")}};
  app.querySelector("#scode").onclick=async()=>{const v=app.querySelector("#ncode").value.trim();if(v.length<4)return toast("4글자 이상으로 넣어 주세요");try{await rpc("sp_set",{pin:S.pin,k:"class_code",v});Store.setCode(v);re("반 코드를 바꿨어요")}catch(e){toast("바꾸지 못했어요")}};
  app.querySelectorAll("[data-det]").forEach(b=>b.onclick=()=>showDetail(b.dataset.det));
};
function showDetail(sid){
  const s=student(sid),g=s.grade,at=Cache.all.filter(a=>a.sid===sid),full=at.filter(a=>a.part==="full");
  const base=full.length?full:at;const last=base[base.length-1];
  const items=parseText(partText(g,last.part));
  const bg=document.createElement("div");bg.className="modal-bg";
  bg.innerHTML=`<div class="modal stack" role="dialog" aria-label="${esc(s.name)} 기록">
    <div class="row"><h3 style="font-size:20px">${esc(s.name)} (${g}학년) — ${full.length?`전체 읽기 ${full.length}회`:"부분 연습만"}, 연습 ${at.length}회</h3><span class="spacer"></span><button class="btn sm" id="cl">닫기</button></div>
    <div class="card">${lineChart([{name:"종합",color:"var(--ink)",bold:true,v:base.map(a=>a.res.total)}].concat(CRIT.map(c=>({name:c.short,color:c.color,v:base.map(a=>a.res[c.k])}))),base.length)}</div>
    <div class="card stack"><div class="row"><h3>최근 기록</h3><span class="small muted">${new Date(last.at).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"})} · ${last.part==="full"?"전체":`${last.part+1}부분`} · ${last.res.total}점</span><span class="spacer"></span><button class="btn sm" id="pl">▶ 녹음 듣기</button></div>
      <div class="small muted num">${CRIT.map(c=>`${c.short} ${last.res[c.k]??"-"}`).join(" · ")} · 시간 ${fmt(last.res.time)}/${fmt(last.res.target)} · 쉼 ${last.res.pauseCount}/${last.res.pauseExp}${last.res.stalls?` · 멈춤 ${last.res.stalls}번`:""}</div>
      ${last.srOk?scriptHtml(items,"res",{word:last.word,pause:last.pause}):scriptHtml(items)}
      <div class="stack" style="gap:8px">${last.fb.good.concat(last.fb.tips).map((t,i)=>`<div class="fb ${i<last.fb.good.length?"good":"tip"}"><span class="ic">${i<last.fb.good.length?"👍":"💡"}</span><p style="margin:0">${esc(t)}</p></div>`).join("")}</div>
    </div>
    <div class="card"><h3 style="margin-bottom:8px">모든 기록</h3><div class="tbl-wrap" style="box-shadow:none"><table style="min-width:620px"><thead><tr><th class="l">날짜</th><th>부분</th><th>종합</th>${CRIT.map(c=>`<th>${c.short}</th>`).join("")}<th>시간</th></tr></thead><tbody>${at.slice().reverse().map(a=>`<tr><td class="l small">${new Date(a.at).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"})}</td><td>${a.part==="full"?"전체":a.part+1}</td><td class="num"><b>${a.res.total}</b></td>${CRIT.map(c=>`<td class="num">${a.res[c.k]??"-"}</td>`).join("")}<td class="num">${fmt(a.res.time)}</td></tr>`).join("")}</tbody></table></div></div>
  </div>`;
  document.body.appendChild(bg);
  const close=()=>{bg.remove();stopAll()};bg.querySelector("#cl").onclick=close;bg.onclick=e=>{if(e.target===bg)close()};
  bg.querySelector("#pl").onclick=async()=>{const b=await getRec(last.id,S.pin);if(!b)return toast("녹음이 없어요 (7일이 지났거나 아직 올라가는 중이에요)");stopAll();onceAudio=new Audio(URL.createObjectURL(b));onceAudio.play()};
}

async function boot(){
  if(!Store.code()){S.view="code";render();return}
  render();
  try{await loadRoster(Store.code());if(S.view==="home")render()}catch(e){if(/bad_code/.test(e.message)){S.view="code";render()}}
  flush();
}
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
boot();
</script>
